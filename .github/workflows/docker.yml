# Builds the Docker image for each torch variant (cpu, cu132) on native
# x86 and ARM runners, then merges both architectures into one multi-arch
# tag per variant on GHCR:
#   cpu:   latest, latest-cpu, cpu, revN, revN-cpu
#   cu132: latest-cuda, cu132, revN-cuda
# on pushes to main, where N is the workflow run number (increments on
# every run). A release tag v1.2.3 adds 1.2.3-cpu / 1.2.3-cuda.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only pushes don't change the image.
    paths-ignore: ["**.md", "LICENSE", "logo.png"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with TORCH_VARIANT in .env.cpu / .env.cuda.
        variant: [cpu, cu132]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          # GHCR image names must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # The CUDA torch wheel plus its bundled libraries take ~10GB while
      # building; the runner's stock toolchains leave too little disk.
      - name: Free disk space
        if: matrix.variant != 'cpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only (no tag); the merge job tags the multi-arch image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TORCH_VARIANT=${{ matrix.variant }}
          # No build-provenance attestation: buildx stores it as an extra
          # manifest that GHCR lists as an "unknown/unknown" platform.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # alias: the variant's name in the friendly tags (latest-cuda, ...).
          - variant: cpu
            alias: cpu
          - variant: cu132
            alias: cuda
    env:
      ON_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}
      IS_CPU: ${{ matrix.variant == 'cpu' }}
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Both variants merge in parallel; an automatic `latest` would
          # make them overwrite each other.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ env.ON_MAIN == 'true' && env.IS_CPU == 'true' }}
            type=raw,value=latest-${{ matrix.alias }},enable=${{ env.ON_MAIN }}
            type=raw,value=${{ matrix.variant }},enable=${{ env.ON_MAIN }}
            type=raw,value=rev${{ github.run_number }},enable=${{ env.ON_MAIN == 'true' && env.IS_CPU == 'true' }}
            type=raw,value=rev${{ github.run_number }}-${{ matrix.alias }},enable=${{ env.ON_MAIN }}
            type=semver,pattern={{version}},suffix=-${{ matrix.alias }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
