# Builds the Docker image for each torch variant (cpu, cu132) on native
# x86 and ARM runners, then merges both architectures into one multi-arch
# tag per variant on GHCR:
#   cpu:   latest, latest-cpu, cpu, 1.0.N, 1.0.N-cpu, revN, revN-cpu
#   cu132: latest-cuda, cu132, 1.0.N-cuda, revN-cuda
# on pushes to main, where N is the number of commits up to this one, so it
# grows with the history. Once both variants are published, it creates the
# git tag v1.0.N and a GitHub Release with the changes since the previous one.
# To start a new line (1.1.N, 2.0.N...) change VERSION_PREFIX below.
name: docker

on:
  push:
    branches: [main]
    # Docs-only pushes don't change the image.
    paths-ignore: ["**.md", "LICENSE", "logo.png"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_PREFIX: "1.0"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      n: ${{ steps.rev.outputs.n }}
      version: ${{ steps.rev.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: N counts the commits.
          fetch-depth: 0

      - id: rev
        run: |
          n=$(git rev-list --count HEAD)
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_PREFIX.$n" >> "$GITHUB_OUTPUT"

  build:
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with TORCH_VARIANT in .env.cpu / .env.cuda.
        variant: [cpu, cu132]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          # GHCR image names must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # The CUDA torch wheel plus its bundled libraries take ~10GB while
      # building; the runner's stock toolchains leave too little disk.
      - name: Free disk space
        if: matrix.variant != 'cpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only (no tag); the merge job tags the multi-arch image.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TORCH_VARIANT=${{ matrix.variant }}
          # No build-provenance attestation: buildx stores it as an extra
          # manifest that GHCR lists as an "unknown/unknown" platform.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # alias: the variant's name in the friendly tags (latest-cuda, ...).
          - variant: cpu
            alias: cpu
          - variant: cu132
            alias: cuda
    env:
      ON_MAIN: ${{ github.ref_name == github.event.repository.default_branch }}
      IS_CPU: ${{ matrix.variant == 'cpu' }}
      N: ${{ needs.version.outputs.n }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Both variants merge in parallel; an automatic `latest` would
          # make them overwrite each other.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ env.ON_MAIN == 'true' && env.IS_CPU == 'true' }}
            type=raw,value=latest-${{ matrix.alias }},enable=${{ env.ON_MAIN }}
            type=raw,value=${{ matrix.variant }},enable=${{ env.ON_MAIN }}
            type=raw,value=${{ env.VERSION }},enable=${{ env.ON_MAIN == 'true' && env.IS_CPU == 'true' }}
            type=raw,value=${{ env.VERSION }}-${{ matrix.alias }},enable=${{ env.ON_MAIN }}
            type=raw,value=rev${{ env.N }},enable=${{ env.ON_MAIN == 'true' && env.IS_CPU == 'true' }}
            type=raw,value=rev${{ env.N }}-${{ matrix.alias }},enable=${{ env.ON_MAIN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  # Only after both variants are published, and only for the default branch.
  # Tags created with GITHUB_TOKEN don't trigger workflows, so this doesn't loop.
  release:
    needs: [version, merge]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release and its git tag
    steps:
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          N: ${{ needs.version.outputs.n }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already exists (re-run of the same commit): nothing to do"
            exit 0
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s\n' \
            "Docker images for x86 and ARM:" \
            "" \
            '```bash' \
            "docker pull $image:$VERSION-cpu    # also $VERSION, rev$N, rev$N-cpu, latest, latest-cpu" \
            "docker pull $image:$VERSION-cuda   # also rev$N-cuda, latest-cuda" \
            '```' \
            "" \
            "Commit: $GITHUB_SHA" > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --generate-notes --latest
