# Pick a build with its env file (defaults below are the CPU build's):
#   docker compose --env-file .env.cpu up -d --build
#   docker compose --env-file .env.cuda up -d --build
services:
  rest-laya:
    container_name: rest-laya
    # Prebuilt by .github/workflows/docker.yml for x86 and ARM, so a host can
    # `docker compose --env-file .env.cuda pull` instead of building.
    # `up --build` builds locally and tags the result with this name.
    image: ghcr.io/wdonega/rest-laya:${TORCH_VARIANT:-cpu}
    build:
      context: .
      args:
        # torch wheel variant: cpu, or the host's CUDA version (e.g. cu132).
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}

    # --- NVIDIA ---
    # nvidia hands the GPU to the container; runc is Docker's default (no GPU).
    # Needs nvidia-container-toolkit; check with `docker info | grep -i runtimes`.
    # Used instead of deploy.resources.reservations.devices, which can't be
    # turned off by a variable and breaks the CPU build on non-NVIDIA hosts.
    runtime: ${DOCKER_RUNTIME:-runc}

    ports:
      - "8055:8055"
    environment:
      # NVIDIA runtime only: GPUs exposed and driver features (compute = CUDA).
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Checkpoints to preload, comma-separated: english, multilingual, typed-decisions.
      LAYA_MODELS: ${LAYA_MODELS:-english}
      # Bearer token for /predict and /v1/systemone. Empty disables auth.
      LAYA_API_TOKEN: ${LAYA_API_TOKEN:-}
      # jev compatibility: enables /v1/systemone and jev-* model ids.
      LAYA_JEV_COMPAT: ${LAYA_JEV_COMPAT:-true}
      # Predictions run at once: 1 on CPU, a few on GPU.
      LAYA_MAX_CONCURRENT_PREDICTIONS: ${LAYA_MAX_CONCURRENT_PREDICTIONS:-1}
    volumes:
      - hf-cache:/root/.cache/huggingface

    # Optional memory cap: ~1GB per checkpoint in LAYA_MODELS + ~1GB.
    # Too low and the container is OOM-killed (exit 137).
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g

    healthcheck:
      # The slim image has no curl, so probe with Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  hf-cache:
