services:
  rest-laya:
    container_name: rest-laya
    build:
      context: .
      args:
        # torch build: cpu here; docker-compose.cuda.yml switches it to CUDA.
        # Overridable from the shell or .env, e.g. TORCH_VARIANT=cu130.
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    ports:
      - "8055:8055"
    environment:
      # Comma-separated checkpoint names to preload. Valid values:
      # english, multilingual, typed-decisions.
      - LAYA_MODELS=english
      # Bearer token required on /predict and /v1/systemone, checked
      # against the request's "Authorization: Bearer <token>" header.
      # Leave empty (or unset entirely) to disable auth -- any request is
      # then accepted with no Authorization header needed.
      - LAYA_API_TOKEN=
      # Turns jev API compatibility on/off. On by default. When on:
      #   - the /v1/systemone endpoint responds (same as /predict); it's
      #     a 404 when off.
      #   - the `model` field also accepts any jev model id (jev-*, e.g.
      #     jev-latest, jev-1.13.0), which resolves to the default
      #     checkpoint (same as omitting `model`).
      # Set to "false" to turn it off (an empty value keeps it on).
      - LAYA_JEV_COMPAT=true
      # How many predictions run at once; extra requests wait their turn.
      # Keep 1 on CPU: one forward pass already uses every core, so more
      # in parallel just fight over them. docker-compose.cuda.yml raises it.
      - LAYA_MAX_CONCURRENT_PREDICTIONS=1
    volumes:
      - hf-cache:/root/.cache/huggingface

    # Each checkpoint listed in LAYA_MODELS is a separate set of weights
    # kept resident in memory (~800MB-1GB each). With just "english" the
    # default Docker Desktop VM (~2GB) is enough; loading 2-3 checkpoints
    # can OOM-kill the container (exit code 137). Uncomment and raise the
    # limits below if LAYA_MODELS has more than one entry.
    # For CUDA, don't edit this file: layer docker-compose.cuda.yml on top
    # (see "Running with CUDA" in the README).
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g
    #     reservations:
    #       memory: 2g

    healthcheck:
      # python:3.11-slim ships without curl, so probe with the stdlib instead.
      # urlopen raises on non-2xx, which makes the check fail.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  hf-cache:
