# Everything that differs between the CPU and CUDA builds is a variable,
# set by a ready-made env file:
#   docker compose --env-file .env.cpu up -d --build
#   docker compose --env-file .env.cuda up -d --build
# The defaults below (after `:-`) are the CPU build's, so a plain
# `docker compose up --build` also works.
services:
  rest-laya:
    container_name: rest-laya
    build:
      context: .
      args:
        # torch build, as its suffix on PyTorch's wheel index: cpu, or the
        # CUDA version matching the host driver (e.g. cu132). See the
        # Dockerfile.
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    # nvidia hands the host's GPUs to the container. It's the runtime
    # nvidia-container-toolkit registers with Docker (`docker info | grep
    # -i runtimes` should list it); runc is Docker's default, no GPU.
    runtime: ${DOCKER_RUNTIME:-runc}
    ports:
      - "8055:8055"
    environment:
      # Which GPUs the nvidia runtime exposes; ignored under runc.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # Comma-separated checkpoint names to preload. Valid values:
      # english, multilingual, typed-decisions.
      LAYA_MODELS: ${LAYA_MODELS:-english}
      # Bearer token required on /predict and /v1/systemone, checked
      # against the request's "Authorization: Bearer <token>" header.
      # Leave empty (or unset entirely) to disable auth -- any request is
      # then accepted with no Authorization header needed.
      LAYA_API_TOKEN: ${LAYA_API_TOKEN:-}
      # Turns jev API compatibility on/off. On by default. When on:
      #   - the /v1/systemone endpoint responds (same as /predict); it's
      #     a 404 when off.
      #   - the `model` field also accepts any jev model id (jev-*, e.g.
      #     jev-latest, jev-1.13.0), which resolves to the default
      #     checkpoint (same as omitting `model`).
      # Set to "false" to turn it off (an empty value keeps it on).
      LAYA_JEV_COMPAT: ${LAYA_JEV_COMPAT:-true}
      # How many predictions run at once; extra requests wait their turn.
      # 1 on CPU: one forward pass already uses every core, so more in
      # parallel just fight over them. On GPU, a few in flight keep the
      # device busy while others do their CPU-side tokenizing.
      LAYA_MAX_CONCURRENT_PREDICTIONS: ${LAYA_MAX_CONCURRENT_PREDICTIONS:-1}
    volumes:
      - hf-cache:/root/.cache/huggingface

    # Each checkpoint listed in LAYA_MODELS is a separate set of weights
    # kept resident in memory (~800MB-1GB each; on GPU they're also loaded
    # through host RAM first). Raise the limit if LAYA_MODELS has more
    # than one entry, or the container can be OOM-killed (exit code 137).
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-4g}

    healthcheck:
      # python:3.11-slim ships without curl, so probe with the stdlib instead.
      # urlopen raises on non-2xx, which makes the check fail.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8055/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  hf-cache:
